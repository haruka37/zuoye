<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnythingLLM 文档上传 · 自动向量化嵌入</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    max-width: 720px; margin: 32px auto; padding: 0 16px; color: #1f2933;
  }
  h1 { font-size: 1.3rem; }
  .card {
    border: 1px solid #e4e7eb; border-radius: 10px; padding: 20px; margin-bottom: 16px;
    background: #fff;
  }
  label { font-weight: 600; display: block; margin-bottom: 6px; font-size: .9rem; }
  input[type=file] {
    display: block; width: 100%; padding: 10px; border: 1px dashed #cbd2d9;
    border-radius: 8px; margin-bottom: 12px; cursor: pointer;
  }
  button {
    background: #2563eb; color: #fff; border: 0; padding: 10px 22px;
    border-radius: 8px; font-size: .95rem; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  #status { font-size: .85rem; margin-top: 12px; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #059669; }
  .err { color: #dc2626; }
  .info { color: #6b7280; font-size: .8rem; margin-top: 8px; }
</style>
</head>
<body>
  <h1>AnythingLLM 文档上传 · 自动向量化嵌入</h1>

  <div class="card">
    <label>上传到工作区</label>
    <div id="ws">正在获取第一个工作区…</div>
    <label>选择文档（可多选）</label>
    <input type="file" id="file" multiple>
    <button id="uploadBtn" disabled>上传并触发嵌入</button>
    <div class="info">上传后会加入第一个工作区，服务端自动对文档进行文本分割并向量化嵌入（异步进行）。</div>
    <div id="status"></div>
  </div>

  <div class="card">
    <label>嵌入状态（自动刷新）</label>
    <div id="embedStatus" class="info">上传文档后自动显示向量化进度。</div>
  </div>

<script>
const API_BASE = "http://localhost:3001/api/v1";
const API_KEY = "MDVACPY-MP544N3-M28M457-12KCH54";
const HEADERS = { "Authorization": `Bearer ${API_KEY}` };

let workspaceSlug = null;
const statusEl = document.getElementById("status");
const statusEmbed = document.getElementById("embedStatus");
let pollTimer = null;

async function api(path, opts = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...opts,
    headers: { ...HEADERS, ...(opts.headers || {}) },
  });
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch {}
  if (!res.ok) throw new Error(data?.error || `${res.status} ${res.statusText}`);
  return data;
}

async function loadFirstWorkspace() {
  const set = (msg, cls) => { const el = document.getElementById("ws"); el.textContent = msg; el.className = cls || ""; };
  try {
    const data = await api("/workspaces");
    const ws = data.workspaces?.[0];
    if (!ws) throw new Error("没有任何工作区，请先在 AnythingLLM 中创建一个工作区");
    workspaceSlug = ws.slug;
    set(`✓ 第一个工作区：${ws.name}（slug: ${ws.slug}）`, "ok");
    document.getElementById("uploadBtn").disabled = false;
    refreshEmbedding();
  } catch (e) {
    set(`✗ 获取工作区失败：${e.message}`, "err");
  }
}

async function handleUpload() {
  const fileInput = document.getElementById("file");
  const files = fileInput.files;
  statusEl.className = "";
  if (!files.length) { statusEl.textContent = "请先选择要上传的文档。"; return; }

  const fd = new FormData();
  for (const f of files) fd.append("file", f);
  fd.append("addToWorkspaces", workspaceSlug);

  document.getElementById("uploadBtn").disabled = true;
  statusEl.textContent = "正在上传并触发嵌入…";
  try {
    const data = await api("/document/upload", { method: "POST", body: fd });
    const docs = data.documents || [];
    statusEl.className = "ok";
    statusEl.textContent = `成功上传 ${docs.length} 个文档，已加入工作区 ${data.workspace?.name || ""}，向量化嵌入已提交（后台异步处理）：\n` +
      docs.map(d => `  · ${d.title} → ${d.location}`).join("\n");
    refreshEmbedding();
  } catch (e) {
    statusEl.className = "err";
    statusEl.textContent = `上传失败：${e.message}`;
  } finally {
    document.getElementById("uploadBtn").disabled = false;
  }
}

async function refreshEmbedding() {
  if (!workspaceSlug) return;
  const el = document.getElementById("embedStatus");
  try {
    const data = await api(`/workspace/${workspaceSlug}`);
    const dss = data.workspace?.[0]?.documents || [];
    const total = dss.length;
    const done = dss.filter(d => d.status === "processed" || d.status === "complete").length;
    const pending = total - done;
    el.className = "ok";
    el.textContent = `工作区共有 ${total} 个文档，已完成向量化 ${done}，处理中/待处理 ${pending}。`;
    clearTimeout(pollTimer);
    if (pending > 0) pollTimer = setTimeout(refreshEmbedding, 3000);
  } catch (e) {
    el.className = "err";
    el.textContent = `查询嵌入状态失败：${e.message}`;
  }
}

document.getElementById("uploadBtn").addEventListener("click", handleUpload);
loadFirstWorkspace();
</script>
</body>
</html>
